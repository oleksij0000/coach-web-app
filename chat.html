<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #17212b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }

    .header {
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 12px;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .coach-msg {
      background-color: #232e3c;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .user-msg {
      background-color: #2b5278;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding-top: 10px;
    }

    input {
      flex: 1;
      background-color: #242f3d;
      border: 1px solid #38485c;
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    button {
      background-color: #5288c1;
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 0 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="header">🧠 Чат с тренером</div>

  <div class="chat-box" id="chatBox">
    <div class="message coach-msg">
      Привет! Задай любой вопрос по тренировке, заезду или пульсу.
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Отправить</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Твой актуальный адрес ngrok
    const SERVER_URL = "https://emphases-shady-lagged.ngrok-free.dev/api/chat";

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');

      // 1. Сообщение пользователя
      const userDiv = document.createElement('div');
      userDiv.className = 'message user-msg';
      userDiv.innerText = text;
      chatBox.appendChild(userDiv);

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // 2. Индикатор ожидания
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message coach-msg';
      loadingDiv.innerText = 'Думаю...';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      // 3. Отправка POST-запроса
      try {
        const response = await fetch(SERVER_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
          },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        loadingDiv.innerText = data.reply;
      } catch (err) {
        loadingDiv.innerText = "❌ Ошибка связи с сервером.";
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
