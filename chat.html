<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат с тренером</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #18222d;
      color: #ffffff;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      height: 95vh;
    }
    .header {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-weight: bold;
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      margin: 15px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .user-msg {
      align-self: flex-end;
      background-color: #2b5278;
      color: #ffffff;
    }
    .coach-msg {
      align-self: flex-start;
      background-color: #212d3b;
      border: 1px solid #2b394a;
    }
    .input-area {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #212d3b;
      color: #fff;
      outline: none;
    }
    button {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background-color: #2481cc;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">🧠 Чат с тренером</div>

  <div class="chat-box" id="chatBox">
    <div class="message coach-msg">
      Привет! Задай любой вопрос по тренировке, заезду или пульсу.
    </div>
  </div>

  <form class="input-area" onsubmit="event.preventDefault(); sendMessage();">
    <input type="text" id="userInput" placeholder="Напиши сообщение..." autocomplete="off" />
    <button type="submit">Отправить</button>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // СЮДА ВСТАВЛЯЕМ ССЫЛКУ ТУННЕЛЯ (без лишнего текста!)
  const SERVER_URL = "https://be9281b5540fb2f0-185-159-162-217.serveousercontent.com/api/chat";

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');

      // 1. Показываем твое сообщение в окне
      const userDiv = document.createElement('div');
      userDiv.className = 'message user-msg';
      userDiv.innerText = text;
      chatBox.appendChild(userDiv);

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // 2. Показываем статус ожидания
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message coach-msg';
      loadingDiv.innerText = 'Думаю...';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      // 3. Отправляем запрос прямо в Python-скрипт (без вызова tg.sendData!)
      try {
        const response = await fetch(SERVER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();

        // 4. Заменяем «Думаю...» на ответ Gemini прямо в этом же окне!
        loadingDiv.innerText = data.reply;
      } catch (err) {
        loadingDiv.innerText = "❌ Ошибка связи с сервером.";
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
